name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    uses: ./.github/workflows/pr-title.yml

  gitleaks:
    uses: ./.github/workflows/gitleaks.yml
