name: Gitleaks

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON runner label or list of labels
        type: string
        default: '"ubuntu-latest"'

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # From the release's gitleaks_8.30.1_checksums.txt.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    steps:
      # Full history so the merge base of the PR's merge commit is present.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks

      # HEAD is the PR's merge commit, so HEAD^1..HEAD^2 is exactly the commits the PR adds to its base.
      - name: Scan the PR's commits
        run: '"$RUNNER_TEMP/gitleaks" git . --no-banner --redact --exit-code 1 --log-opts="HEAD^1..HEAD^2"'
