name: PR title

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON runner label or list of labels
        type: string
        default: '"ubuntu-latest"'
      types:
        description: Space-separated conventional commit types
        type: string
        default: feat fix perf refactor docs style test build ci chore revert
      max-length:
        description: Maximum title length in characters
        type: number
        default: 100

permissions: {}

jobs:
  pr-title:
    name: PR title
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          TYPES: ${{ inputs.types }}
          MAX_LENGTH: ${{ inputs.max-length }}
        run: |
          status=0
          fail() { echo "::error title=PR title::$1"; status=1; }
          (( ${#TITLE} <= MAX_LENGTH )) || fail "is ${#TITLE} characters, the maximum is $MAX_LENGTH"
          [[ $TITLE != *—* ]] || fail "contains an em dash"
          [[ $TITLE != *. ]] || fail "ends with a full stop"
          if [[ $TITLE =~ ^([^\(\)!:]+)(\(([^\)]*)\))?!?:\ (.*)$ ]]; then
            type=${BASH_REMATCH[1]} scope_group=${BASH_REMATCH[2]} scope=${BASH_REMATCH[3]} subject=${BASH_REMATCH[4]}
            [[ " $TYPES " == *" $type "* ]] || fail "type '$type' is not one of: $TYPES"
            [[ -z $scope_group || $scope =~ ^[a-z0-9._/-]+$ ]] || fail "scope '$scope' must be non-empty and lower-case"
            [[ $subject =~ [^[:space:]] ]] || fail "subject is empty"
          else
            fail "must be 'type(scope)!: subject', with scope and ! optional"
          fi
          [ "$status" = 0 ] && echo "PR title OK: $TITLE"
          exit "$status"
